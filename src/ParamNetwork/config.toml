[train_params]
data_dir = "/data/solar_wind_pred_vignesh/hdf/"
base_dir = "/data/solar_wind_pred_vignesh"
batch_size = 5
n_epochs = 100
lr = 1e-4
data_transform = ['arcsinh', 'sqrt', 'arcsinh', 'arcsinh', 'arcsinh', 'arcsinh', 'arcsinh', 'arcsinh', 'pow']
gradnorm_alpha = 1.5
gradnorm_lr = 1e-4
use_gradnorm = true
resolutions = ['medium']
normalization='standard'

[model_params]
model_type = 'ParamNetworkPhysics'
operator_type = 'local_no'
scale_up = 1
loss_fn = 'l2'
pos_embedding = true
l1_lambda = 1e-8
modes = [109,128]
rank = 0.4
conv_module = 'spherical'
n_layers=8
temperature_lambda = 1e-1
J_curl_lambda = 1e-2
positivity_lambda = 1e-4

[wandb_params]
enable_wandb_logging = true
run_name = 'V2_gradnorm_physics_J_curl_positivity_implied_temperature'
group_name = 'PhysicsConstraints'
description = 'Test' 